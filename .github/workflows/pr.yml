name: pr

# Commit format and the CHANGELOG rule for a pull request. Commitlint
# uses the calling repo's config, or the default below when it has none.
on:
  workflow_call:
    inputs:
      commitlint:
        description: Lint the commits and PR title; off leaves only the CHANGELOG guard
        type: boolean
        default: true
      working-directory:
        description: Directory commitlint runs in and looks for its config
        type: string
        default: "."
      node-version:
        description: Node.js for commitlint
        type: string
        default: "24"
      commitlint-version:
        description: Version of @commitlint/cli and @commitlint/config-conventional
        type: string
        default: "19.8.1"
      changelog-label:
        description: PRs with this label must change CHANGELOG.md
        type: string
        default: user-facing

permissions:
  contents: read

jobs:
  commitlint:
    if: inputs.commitlint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - run: >-
          npm install --no-save
          "@commitlint/cli@${{ inputs.commitlint-version }}"
          "@commitlint/config-conventional@${{ inputs.commitlint-version }}"
      - name: Use the default config when the repo has none
        run: |
          for f in .commitlintrc .commitlintrc.json .commitlintrc.yaml .commitlintrc.yml \
            .commitlintrc.js .commitlintrc.cjs .commitlintrc.mjs .commitlintrc.ts .commitlintrc.cts \
            commitlint.config.js commitlint.config.cjs commitlint.config.mjs \
            commitlint.config.ts commitlint.config.cts commitlint.config.mts; do
            if [ -e "$f" ]; then
              echo "Using the repo's $f"
              exit 0
            fi
          done
          if [ -f package.json ] && grep -q '"commitlint"' package.json; then
            echo "Using the commitlint key in package.json"
            exit 0
          fi
          echo "No commitlint config here; using the default"
          cat > commitlint.config.mjs <<'EOF'
          export default {
            extends: ["@commitlint/config-conventional"],
            ignores: [(message) => /^build\(deps(-dev)?\): Bump /.test(message)],
            rules: { "body-max-line-length": [0] },
          };
          EOF
      - name: Lint commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      # Outside a pull request there is no range; lint the commit the run is for.
      - name: Lint the last commit
        if: github.event_name != 'pull_request'
        run: npx commitlint --last --verbose
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "$TITLE" | npx commitlint --verbose

  # A user-facing change without its CHANGELOG line is unfinished.
  changelog:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, inputs.changelog-label)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LABEL: ${{ inputs.changelog-label }}
        run: |
          if ! git diff --name-only "$BASE"...HEAD | grep -qx CHANGELOG.md; then
            echo "::error::PRs labelled $LABEL must add an entry to CHANGELOG.md"
            exit 1
          fi
