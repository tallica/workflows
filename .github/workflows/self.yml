name: self

# This repo's own CI: every shared workflow, called at this commit.
# go.yml and govulncheck.yml run against the fixture in testdata/go.
on:
  push:
    branches: ["master"]
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  pr:
    uses: ./.github/workflows/pr.yml

  # A directory with no commitlint config, so the default is used.
  pr-default-config:
    uses: ./.github/workflows/pr.yml
    with:
      working-directory: testdata/go

  pr-no-commitlint:
    uses: ./.github/workflows/pr.yml
    with:
      commitlint: false

  go:
    uses: ./.github/workflows/go.yml
    permissions:
      contents: write # go.yml's release job asks for it; release: false keeps it off
    with:
      working-directory: testdata/go
      release: false

  # The same with format off, as a repo without Prettier calls it.
  go-no-format:
    uses: ./.github/workflows/go.yml
    permissions:
      contents: write
    with:
      working-directory: testdata/go
      format: false
      release: false

  check-no-format:
    uses: ./.github/workflows/check.yml
    with:
      format: false

  govulncheck:
    uses: ./.github/workflows/govulncheck.yml
    with:
      working-directory: testdata/go
